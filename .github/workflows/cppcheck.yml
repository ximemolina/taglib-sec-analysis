name: cppcheck

on:
  push:
    branches:
      - cppcheck-analysis
  pull_request:
    branches:
      - main

jobs:
  cppcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck cmake g++ zlib1g-dev libcppunit-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON \
            -DBUILD_EXAMPLES=ON

      - name: Check Cppcheck configuration
        run: |
          cppcheck \
            --project=build/compile_commands.json \
            --library=std,posix,gnu \
            --platform=unix64 \
            --check-config 2>&1 | tee check-config.log
          # Falla el job si hay configuraciones faltantes críticas
          if grep -q "Cppcheck cannot find all the include files" check-config.log; then
            echo "::warning::Hay includes sin resolver, revisar check-config.log"
          fi

      - name: Run Cppcheck (full project, all checkers)
        run: |
          cppcheck \
            --project=build/compile_commands.json \
            --library=std,posix,gnu \
            --platform=unix64 \
            --enable=all \
            --inconclusive \
            --check-level=exhaustive \
            --std=c++17 \
            --checkers-report=checkers-report.txt \
            --xml --xml-version=2 \
            2> cppcheck-results.xml

      - name: Show checker activation rate
        run: |
          tail -n 5 checkers-report.txt
          grep "Active checkers" cppcheck-results.xml || true

      - name: Generate summary
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          import os

          root = ET.parse("cppcheck-results.xml").getroot()
          errors = root.findall(".//error")

          summary = os.environ["GITHUB_STEP_SUMMARY"]

          with open(summary, "a", encoding="utf-8") as f:
              f.write("# Cppcheck Results\n\n")
              f.write(f"**Total findings:** {len(errors)}\n\n")

              if not errors:
                  f.write("No findings were reported.\n")
              else:
                  f.write("| File | Line | Severity | CWE | Message |\n")
                  f.write("|---|---:|---|---|---|\n")

                  for error in errors:
                      loc = error.find("location")
                      file_path = loc.get("file", "") if loc is not None else ""
                      line = loc.get("line", "") if loc is not None else ""
                      severity = error.get("severity", "")
                      cwe = error.get("cwe", "")
                      message = error.get("msg", "")

                      f.write(
                          f"| `{file_path}` | {line} | {severity} | "
                          f"{cwe or '-'} | {message} |\n"
                      )
          PY

      - name: Upload Cppcheck results
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-results
          path: |
            ./cppcheck-results.xml
            ./checkers-report.txt
