name: cppcheck

on:
  push:
    branches:
      - cppcheck-analysis
  pull_request:
    branches:
      - main

jobs:
  cppcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck cmake g++

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Create compilation database for selected files
        run: |
          python3 <<'PY'
          import json

          selected = {
              "oggpageheader.cpp",
              "xiphcomment.cpp",
              "asffile.cpp",
              "dsdifffile.cpp",
              "itfile.cpp",
              "s3mfile.cpp",
              "modfile.cpp"
          }

          with open("build/compile_commands.json", encoding="utf-8") as f:
              commands = json.load(f)

          filtered = [
              entry for entry in commands
              if any(entry["file"].endswith(name) for name in selected)
          ]

          with open(
              "build/compile_commands-7files.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(filtered, f, indent=2)

          print(f"Selected compilation commands: {len(filtered)}")

          for entry in filtered:
              print(entry["file"])

          if len(filtered) != 7:
              raise RuntimeError(
                  f"Expected 7 files, but found {len(filtered)}"
              )
          PY

      - name: Check Cppcheck configuration
        run: |
          cppcheck \
            --project=build/compile_commands-7files.json \
            --check-config

      - name: Run Cppcheck
        run: |
          cppcheck \
            --project=build/compile_commands-7files.json \
            --enable=all \
            --inconclusive \
            --xml \
            --xml-version=2 \
            2> cppcheck-results.xml

      - name: Generate summary
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          import os

          root = ET.parse("cppcheck-results.xml").getroot()
          errors = root.findall(".//error")

          summary = os.environ["GITHUB_STEP_SUMMARY"]

          with open(summary, "a", encoding="utf-8") as f:
              f.write("# Cppcheck Results\n\n")
              f.write(f"**Total findings:** {len(errors)}\n\n")

              if not errors:
                  f.write("No findings were reported.\n")
              else:
                  f.write("| File | Line | Severity | CWE | Message |\n")
                  f.write("|---|---:|---|---|---|\n")

                  for error in errors:
                      file_path = error.get("file", "")
                      line = error.get("line", "")
                      severity = error.get("severity", "")
                      cwe = error.get("cwe", "")
                      message = error.get("msg", "")

                      f.write(
                          f"| `{file_path}` | {line} | {severity} | "
                          f"{cwe or '-'} | {message} |\n"
                      )
          PY

      - name: Upload Cppcheck results
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-results
          path: ./cppcheck-results.xml
