name: clang-tidy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cmake ninja-build zlib1g-dev libutfcpp-dev

      - name: Configure CMake (generate compile_commands.json)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Run clang-tidy
        run: |
          test -f build/compile_commands.json
          # run-clang-tidy only analyzes translation units listed in
          # compile_commands.json (not headers/tests/examples outside the DB).
          run-clang-tidy -p build -j "$(nproc)" -quiet
